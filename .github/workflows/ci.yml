name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --all-packages

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy packages plugins tools

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests
        run: uv run pytest tests -q --junitxml=pytest.xml

      - name: Annotate test failures
        if: failure()
        run: uv run python tools/annotate_pytest_failures.py pytest.xml
      - name: Dump first failure (debug)
        if: failure()
        run: uv run pytest tests -q --tb=short --no-header -x 2>&1 | uv run python tools/emit_lines_as_errors.py

      - name: Docs gate
        run: uv run python tools/check_docs.py
