name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked --all-packages --group dev

      - name: Tests and coverage
        id: tests
        run: uv run --frozen --all-packages pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=build/reports/pytest.xml

      - name: Validate bundled plugins with offline samples
        if: ${{ !cancelled() }}
        run: uv run --frozen --all-packages python -B -m mailflow_testkit.plugin_smoke --root plugins --source

      - name: Lint (ruff check)
        if: ${{ !cancelled() }}
        run: uv run --frozen --all-packages ruff check .

      - name: Format (ruff format)
        if: ${{ !cancelled() }}
        run: uv run --frozen --all-packages ruff format --check .

      - name: Type check (mypy)
        if: ${{ !cancelled() }}
        run: uv run --frozen --all-packages mypy packages plugins tools

      - name: Type check (pyright)
        if: ${{ !cancelled() }}
        run: uv run --frozen --all-packages python -c "import subprocess, sys; sys.exit(subprocess.call([sys.executable, '-m', 'pyright', '--pythonpath', sys.executable]))"

      - name: Build workspace wheels
        if: ${{ !cancelled() }}
        run: uv run --frozen --all-packages python tools/build_all.py --offline

      - name: Annotate test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: uv run --frozen --all-packages python tools/annotate_pytest_failures.py build/reports/pytest.xml

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.python }}
          path: build/reports/
          if-no-files-found: warn

