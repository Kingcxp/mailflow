name: release

# Build per-platform installers on a version tag and publish a GitHub
# release with them. The first release ships without notes (nothing has
# been user-tested yet); later releases embed their CHANGELOG section.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        run: python tools/build_all.py --version "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/wheels/*.whl
          if-no-files-found: error

  frozen:
    name: frozen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mailflow-linux-x86_64
          - os: windows-latest
            artifact: mailflow-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies (incl. nuitka)
        run: uv sync --locked --all-packages --group dev
      - name: Build frozen standalone executable
        run: uv run --frozen --all-packages python tools/build_exe.py --mode standalone --download-tools
      - name: Check standalone startup without external services
        run: |
          python -c "import subprocess, sys; from pathlib import Path; binary = Path('dist/standalone/frozen_entry.dist') / ('mailflow.exe' if sys.platform == 'win32' else 'mailflow'); subprocess.run([str(binary), 'config-check', '-c', 'configs/example.toml'], check=True)"
      - name: Build frozen onefile executable
        run: uv run --frozen --all-packages python tools/build_exe.py --mode onefile --download-tools
      - name: Rename artifact
        run: |
          python -c "import shutil, sys; from pathlib import Path; source = Path('dist/onefile') / ('mailflow.exe' if sys.platform == 'win32' else 'mailflow'); target = Path('dist/release/${{ matrix.artifact }}'); target.parent.mkdir(parents=True, exist_ok=True); shutil.copy2(source, target)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [wheels, frozen]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/reports
          if python tools/changelog_for_release.py "$VERSION" > build/reports/release-notes.md 2>/dev/null; then
            echo "notes found for $VERSION"
          else
            echo "no CHANGELOG section for $VERSION — using fallback note"
            echo "MailFlow $VERSION. See CHANGELOG.md for the full history." > build/reports/release-notes.md
          fi
      - name: Publish pre-release
        # every automated release is a pre-release until explicitly
        # promoted: the project has not shipped a user-tested stable yet
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: build/reports/release-notes.md
          files: release/*
          fail_on_unmatched_files: true
