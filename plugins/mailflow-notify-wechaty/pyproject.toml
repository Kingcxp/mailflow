[project]
name = "mailflow-notify-wechaty"
version = "0.1.0"
description = "WeChaty gateway notifier for MailFlow (WeChat contacts and rooms)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.entry-points."mailflow.plugins"]
wechaty = "mailflow_notify_wechaty.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_wechaty"]
