[project]
name = "mailflow-storage-sqlite"
version = "0.1.0"
description = "MailFlow sqlite storage backend with seven-day recovery trash"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-storage-sqlite = "mailflow_storage_sqlite.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_storage_sqlite"]
