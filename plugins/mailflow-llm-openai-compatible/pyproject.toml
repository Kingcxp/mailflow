[project]
name = "mailflow-llm-openai-compatible"
version = "0.2.0"
description = "MailFlow OpenAI-compatible chat completions LLM backend"
requires-python = ">=3.11"
dependencies = ["mailflow-core", "httpx>=0.27"]

[project.entry-points."mailflow.plugins"]
mailflow-llm-openai-compatible = "mailflow_llm_openai_compatible.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_llm_openai_compatible"]
