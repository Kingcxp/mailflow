[project]
name = "mailflow-notify-openclaw-weixin"
version = "0.1.0"
description = "Tencent OpenClaw WeChat (ClawBot/iLink) notifier for MailFlow"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.entry-points."mailflow.plugins"]
openclaw-weixin = "mailflow_notify_openclaw_weixin.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_openclaw_weixin"]
