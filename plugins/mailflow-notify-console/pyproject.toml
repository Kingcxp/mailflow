[project]
name = "mailflow-notify-console"
version = "0.1.0"
description = "MailFlow console notifier: emits processed mail alerts via logging"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-console = "mailflow_notify_console.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_console"]
