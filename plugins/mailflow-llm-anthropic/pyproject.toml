[project]
name = "mailflow-llm-anthropic"
version = "0.1.0"
description = "MailFlow LLM backend: Anthropic Messages API (Claude)"
requires-python = ">=3.11"
dependencies = ["mailflow-core", "httpx"]

[project.entry-points."mailflow.plugins"]
anthropic = "mailflow_llm_anthropic.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_llm_anthropic"]
