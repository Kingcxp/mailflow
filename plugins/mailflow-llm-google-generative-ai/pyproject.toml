[project]
name = "mailflow-llm-google-generative-ai"
version = "0.1.0"
description = "Google Generative AI (Gemini API) backend for MailFlow"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.entry-points."mailflow.plugins"]
google-generative-ai = "mailflow_llm_google_generative_ai.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_llm_google_generative_ai"]
