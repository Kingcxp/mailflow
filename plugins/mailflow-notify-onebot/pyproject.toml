[project]
name = "mailflow-notify-onebot"
version = "0.1.0"
description = "OneBot v11 (QQ) notifier for MailFlow"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.entry-points."mailflow.plugins"]
onebot = "mailflow_notify_onebot.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_onebot"]
