[project]
name = "mailflow-notify-whatsapp"
version = "0.1.0"
description = "WhatsApp gateway for MailFlow (Baileys scan-to-login, no token)"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-whatsapp = "mailflow_notify_whatsapp.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_whatsapp"]
