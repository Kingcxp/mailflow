[project]
name = "mailflow-processor-llm-importance"
version = "0.1.0"
description = "MailFlow LLM importance processor: four-level urgency analysis"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
llm-importance = "mailflow_processor_llm_importance.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_processor_llm_importance"]
