[project]
name = "mailflow-export-astrbot"
version = "0.1.0"
description = "MailFlow bot exporter: generates an AstrBot plugin from a configured instance"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
astrbot-export = "mailflow_export_astrbot.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_export_astrbot"]
