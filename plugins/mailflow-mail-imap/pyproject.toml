[project]
name = "mailflow-mail-imap"
version = "0.1.0"
description = "MailFlow mail source: IMAP/SMTP with built-in presets for QQ, 163, Outlook, Gmail and generic hosts"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-mail-imap = "mailflow_mail_imap.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_mail_imap"]
