[project]
name = "mailflow-notify-wechatpadpro"
version = "0.1.0"
description = "WeChat notifier via WeChatPadPro (WeChat Pad protocol gateway) with docker auto-deploy"
requires-python = ">=3.11"
dependencies = ["mailflow-core", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_notify_wechatpadpro"]

[project.entry-points."mailflow.plugins"]
mailflow-notify-wechatpadpro = "mailflow_notify_wechatpadpro.plugin:plugin"
