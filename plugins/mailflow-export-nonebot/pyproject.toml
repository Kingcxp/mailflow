[project]
name = "mailflow-export-nonebot"
version = "0.1.0"
description = "MailFlow bot exporter: generates a NoneBot2 plugin from a configured instance"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-export-nonebot = "mailflow_export_nonebot.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_export_nonebot"]
