[project]
name = "mailflow-mail-fake"
version = "0.1.0"
description = "MailFlow fake mail source plugin for local development and demos"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[project.entry-points."mailflow.plugins"]
mailflow-mail-fake = "mailflow_mail_fake.plugin:plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_mail_fake"]
