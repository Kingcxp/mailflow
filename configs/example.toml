# MailFlow example configuration.
#
# Copy this file to configs/local.toml (gitignored) and fill in your tokens,
# or export the referenced environment variables. Whole-string ${ENV_VAR}
# placeholders are expanded at load time; embedded placeholders stay literal.
#
# No accounts or LLMs are predefined: uncomment/add your own below.

[general]
language = "en"                 # default display language (en | zh-CN | custom packs)
timezone = "Asia/Shanghai"      # IANA timezone for display and the daily cleanup
mail_retention_days = 30        # mails older than this are moved to trash daily
trash_retention_days = 7        # trash records older than this are purged
cleanup_hour = 4                # local-time cleanup hour
cleanup_minute = 0
reminder_days_before = 2        # days before a timed action's due date for the early reminder
reminder_hour = 8               # local-time hour of that early reminder
reminder_minute = 0
reminder_interval_seconds = 60  # how often the reminder scheduler checks (a reminder also fires at 00:00 on the due date)
queue_size = 500                # bounded inbound queue
workers = 2                     # concurrent pipeline workers

[logging]
level = "INFO"                  # mailflow logger level
console = true
console_level = "INFO"
# console_redirect = "logs/console.log"   # mirror console output to a file
file = true
file_path = "logs/mailflow.log"
file_level = "INFO"
file_max_bytes = 10485760
file_backup_count = 5
jsonl = false
# jsonl_path = "logs/mailflow.jsonl"      # optional machine-readable sink

[plugins]
# non-empty `enabled` acts as an allowlist; `disabled` always blocks.
enabled = []
disabled = []

[storage]
provider = "sqlite"
path = "data/mailflow.db"

# --- Mail accounts ----------------------------------------------------------
# Each account references a mail source adapter component (see
# `mailflow plugin market list` for available adapters).
#
# [[accounts]]
# account_id = "my-mailbox"
# provider = "<your-mail-source-adapter>"
# email = "you@example.com"
# enabled = true
# [accounts.options]
# ...adapter-specific options...

# --- LLMs -------------------------------------------------------------------
# provider selects the backend adapter component; the rest of the fields are
# the OpenAI-compatible request configuration.
#
# [[llms]]
# llm_id = "my-llm"
# name = "My relay"
# provider = "openai-compatible"
# base_url = "https://your-relay.example/v1"
# api_key = "${YOUR_TOKEN}"      # or use api_key_env = "YOUR_TOKEN"
# model = "your-model"
# timeout_seconds = 60
# max_retries = 2
# default = true
# fallback = []                  # ordered fallback named llms
# headers = { }                  # extra HTTP headers (secrets are redacted)
# query = { }                    # extra query-string parameters
# extra_body = { }               # extra JSON body fields

# --- Processors -------------------------------------------------------------
# Ordered processing chain: rules first (deterministic, no LLM), then the
# semantic LLM analysis with the configured primary/fallback LLMs.
[[processors]]
processor_id = "rules"
provider = "rules"
priority = 10
retries = 0
[processors.options]
advertising_keywords = ["unsubscribe", "sale", "promotion", "discount", "limited offer"]
# important_senders = ["registrar@university.example"]

# [[processors]]
# processor_id = "llm-importance"
# provider = "llm-importance"
# priority = 20
# llm = "my-llm"                 # primary named LLM (must exist above)
# fallback_llms = []             # ordered fallback
# failure_policy = "continue"    # continue | stop
# retries = 1
# timeout_seconds = 30
# [processors.options]
# max_summary_chars = 600

# --- Notifiers --------------------------------------------------------------
# Called only when the effective urgency meets the threshold.
[[notifiers]]
notifier_id = "console"
provider = "console"
enabled = true
minimum_urgency = "important"              # ad | info | important | urgent

[i18n]
language = "en"
extra_dirs = ["translations"]              # data-only JSON language packs
