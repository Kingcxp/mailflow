# MailFlow development configuration.
#
# No accounts or LLMs are predefined: add your own below and they are picked
# up on the next start. This file is safe to edit freely; secrets belong in
# environment variables (whole-string ${VAR} placeholders are expanded at
# load time) or in configs/local.toml (gitignored).

[general]
language = "en"
timezone = "Asia/Shanghai"
mail_retention_days = 30
trash_retention_days = 7
cleanup_hour = 4
cleanup_minute = 0
reminder_days_before = 2        # days before a timed action's due date for the early reminder
reminder_hour = 8
reminder_minute = 0
reminder_interval_seconds = 60  # scheduler wake interval; a reminder also fires at 00:00 on the due date
queue_size = 500
workers = 2

[logging]
level = "INFO"
console = true
console_level = "INFO"
file = true
file_path = "logs/mailflow.log"
file_level = "INFO"
file_max_bytes = 10485760
file_backup_count = 5
jsonl = false

[plugins]
enabled = []
disabled = []

[storage]
provider = "sqlite"
path = "data/development.db"

# --- Mail accounts ----------------------------------------------------------
# Add one block per mailbox, or add them from the TUI's Mailboxes tab.
# `provider` is a mail source component id; `imap` is built in (presets for
# qq / 163 / outlook / gmail, or explicit hosts for a school/work server).
# `mailflow adapter list` shows every loaded source.
#
# [[accounts]]
# account_id = "my-mailbox"
# provider = "imap"
# email = "you@example.com"
# enabled = true
# [accounts.options]
# preset = "qq"                    # qq | 163 | outlook | gmail
# username = "you@qq.com"
# password = "${MAIL_PASSWORD}"    # QQ/163 need an authorization code
# interval_seconds = 300
# limit = 20                       # newest mails ingested on the first poll

# --- LLMs -------------------------------------------------------------------
# Add one block per model endpoint, or use the TUI's LLMs tab (there the list
# order is the fallback chain: first entry is the default). `openai-compatible`
# and `anthropic` are both built in.
#
# [[llms]]
# llm_id = "my-llm"
# provider = "openai-compatible"
# base_url = "https://your-relay.example/v1"
# api_key = "${YOUR_TOKEN}"          # or api_key_env = "YOUR_TOKEN"
# model = "your-model"
# default = true
# fallback = []

# --- Processors -------------------------------------------------------------
# rules: deterministic ad/sender pre-filter (no LLM needed).
[[processors]]
processor_id = "rules"
provider = "rules"
priority = 10
retries = 0

# llm-importance: four-level urgency + timed actions. Uncomment once you have
# configured an LLM above and set `llm` to its llm_id.
# [[processors]]
# processor_id = "llm-importance"
# provider = "llm-importance"
# priority = 20
# llm = "my-llm"
# fallback_llms = []
# failure_policy = "continue"
# retries = 0
# timeout_seconds = 30

# --- Notifiers --------------------------------------------------------------
[[notifiers]]
notifier_id = "console"
provider = "console"
enabled = true
minimum_urgency = "important"

[i18n]
language = "en"
extra_dirs = ["translations"]
