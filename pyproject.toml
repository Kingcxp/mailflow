[project]
name = "mailflow-workspace"
version = "0.1.0"
description = "MailFlow: unified multi-account mail inbox with plugin pipeline, LLM analysis and rich TUI"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.uv.sources]
mailflow-core = { workspace = true }
mailflow-testkit = { workspace = true }
mailflow-bundled = { workspace = true }
mailflow-cli = { workspace = true }
mailflow-tui = { workspace = true }
mailflow-mail-fake = { workspace = true }
mailflow-storage-sqlite = { workspace = true }
mailflow-llm-openai-compatible = { workspace = true }
mailflow-notify-console = { workspace = true }
mailflow-export-nonebot = { workspace = true }
mailflow-export-astrbot = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "coverage>=7.6",
  "ruff>=0.12",
  "mypy>=1.17",
  "pyright>=1.1.400",
  "nuitka>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages", "plugins", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]
allowed-confusables = ["（", "）", "：", "！", "。", "，"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = [
  "packages/mailflow-core/src",
  "packages/mailflow-testkit/src",
  "packages/mailflow-bundled/src",
  "packages/mailflow-cli/src",
  "packages/mailflow-tui/src",
  "plugins/mailflow-mail-fake/src",
  "plugins/mailflow-storage-sqlite/src",
  "plugins/mailflow-llm-openai-compatible/src",
  "plugins/mailflow-notify-console/src",
  "plugins/mailflow-export-nonebot/src",
  "plugins/mailflow-export-astrbot/src",
  "plugins/mailflow-notify-telegram/src",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["packages", "plugins", "tests", "tools"]
exclude = [".venv", "dist", "build", "mailflow-generated"]
extraPaths = [
  "packages/mailflow-core/src",
  "packages/mailflow-testkit/src",
  "packages/mailflow-bundled/src",
  "packages/mailflow-cli/src",
  "packages/mailflow-tui/src",
  "plugins/mailflow-mail-fake/src",
  "plugins/mailflow-storage-sqlite/src",
  "plugins/mailflow-llm-openai-compatible/src",
  "plugins/mailflow-notify-console/src",
  "plugins/mailflow-export-nonebot/src",
  "plugins/mailflow-export-astrbot/src",
  "plugins/mailflow-notify-telegram/src",
]
