accounts = []
notifiers = []

[general]
language = "en"
timezone = "UTC"
mail_retention_days = 30
trash_retention_days = 7
cleanup_hour = 4
cleanup_minute = 0
queue_size = 500
workers = 2
reminder_days_before = 2
reminder_hour = 8
reminder_minute = 0
reminder_interval_seconds = 60
auto_update = true
summary_language = ""

[logging]
level = "INFO"
console = true
console_level = "INFO"
file = true
file_path = "logs/mailflow.log"
file_level = "INFO"
file_max_bytes = 10485760
file_backup_count = 5
jsonl = false
jsonl_path = "logs/mailflow.jsonl"
jsonl_level = "INFO"

[logging.logger_levels]

[plugins]
enabled = []
disabled = []

[[plugins.repositories]]
name = "mailflow-repo"
url = "https://raw.githubusercontent.com/Kingcxp/mailflow-repo/main"

[[llms]]
llm_id = "t1"
name = ""
provider = "openai-completions"
base_url = "https://x"
api_key = ""
api_key_env = "K"
model = "m1"
timeout_seconds = 60.0
max_retries = 2
default = true
fallback = []

[llms.headers]

[llms.query]

[llms.extra_body]

[llms.options]

[[processors]]
processor_id = "llm-importance"
provider = "llm-importance"
enabled = true
priority = 20
llm = "t1"
fallback_llms = []
failure_policy = "continue"
retries = 1
timeout_seconds = 30.0

[processors.options]

[server]
host = "127.0.0.1"
port = 8800
username = ""
password = ""

[storage]
provider = "sqlite"
path = "data/mailflow.db"

[storage.options]

[i18n]
language = "en"
extra_dirs = []
