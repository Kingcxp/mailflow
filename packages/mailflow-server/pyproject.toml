[project]
name = "mailflow-server"
version = "0.1.0"
description = "REST + WebSocket host for MailFlow: remote TUI clients and bots"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.entry-points."mailflow.plugins"]
# no components: this package hosts a server, it does not extend the pipeline

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_server"]
