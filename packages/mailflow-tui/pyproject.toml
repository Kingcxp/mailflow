[project]
name = "mailflow-tui"
version = "0.1.0"
description = "MailFlow Textual terminal UI host"
requires-python = ">=3.11"
dependencies = [
  "mailflow-core",
  "mailflow-bundled",
  "rich>=13.7",
  "textual>=0.80",
]

[project.scripts]
mailflow-tui = "mailflow_tui.runner:run_tui_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_tui"]
