[project]
name = "mailflow-bundled"
version = "0.1.0"
description = "MailFlow composition package: the official built-in plugin set"
requires-python = ">=3.11"
dependencies = [
  "mailflow-core",
  "mailflow-mail-fake",
  "mailflow-mail-imap",
  "mailflow-storage-sqlite",
  "mailflow-llm-openai-compatible",
  "mailflow-llm-anthropic",
  "mailflow-notify-console",
  "mailflow-export-nonebot",
  "mailflow-export-astrbot",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_bundled"]
