[project]
name = "mailflow-testkit"
version = "0.1.0"
description = "MailFlow testkit: deterministic fake components for tests and demos"
requires-python = ">=3.11"
dependencies = ["mailflow-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_testkit"]
