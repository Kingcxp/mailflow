[project]
name = "waymark-mail"
version = "0.1.0"
description = "A terminal inbox for email, follow-up tasks and an optional AI assistant"
readme = {text = "Waymark Mail brings multiple mailboxes, replies, tasks and notifications into one local terminal workspace. See the project homepage for installation and usage. Formerly MailFlow; existing configuration, data and plugins remain compatible.", content-type = "text/markdown"}
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Waymark Mail contributors"}]
keywords = ["email", "terminal", "tui", "tasks", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email :: Email Clients (MUA)",
]
dependencies = ["mailflow-cli==0.1.0"]

[project.urls]
Homepage = "https://github.com/Kingcxp/waymark-mail"
Documentation = "https://github.com/Kingcxp/waymark-mail/blob/dev/README.md"
Issues = "https://github.com/Kingcxp/waymark-mail/issues"
Source = "https://github.com/Kingcxp/waymark-mail"
Changelog = "https://github.com/Kingcxp/waymark-mail/blob/dev/CHANGELOG.md"

[project.scripts]
waymark = "mailflow_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waymark_mail"]
