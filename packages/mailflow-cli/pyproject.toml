[project]
name = "mailflow-cli"
version = "0.1.0"
description = "MailFlow command-line host"
requires-python = ">=3.11"
dependencies = [
  "mailflow-core",
  "mailflow-bundled",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
mailflow = "mailflow_cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailflow_cli"]
